seed: 42
run_name: tddi_seed42

# `python src/train.py` trains one corrected functional member.
# Use `python src/tddi_cv.py` for the paper's train+validation 3-fold ensemble.

data:
  root: Dataset
  train_files: [train_extracted.csv]
  validation_files: [validation_extracted.csv]
  test_files: [test_extracted.csv]
  target_column: class
  expected_num_features: 3780
  num_classes: 178
  block_size_mb: 64
  batch_size: 256
  stats_path: train_stats.npz
  split_manifest: null

preprocessing:
  max_rows: null
  min_std: 1.0e-6
  # Released T-DDI applies only its model-internal LayerNorm. It does not fit
  # a per-feature StandardScaler.
  normalization: none

model:
  name: tddi_mlp
  # Active numerical path of tab-transformer-pytorch==0.4.2:
  # 3780 -> 7560 -> 7560 -> 178. The unused categorical transformer is omitted.
  hidden_multipliers: [2, 2]

loss:
  name: focal
  gamma: 1.0
  class_weighting: none
  effective_beta: 0.9999
  label_smoothing: 0.0
  moe_balance_weight: 0.0
  router_z_weight: 0.0

training:
  epochs: 200
  max_rows: null
  max_steps_per_epoch: null
  learning_rate: 9.4526e-5
  weight_decay: 1.5446e-4
  gradient_clip_norm: null
  gradient_accumulation_steps: 1
  mixed_precision: false
  cosine_t_max: 50
  early_stopping_patience: 50
  selection_metric: accuracy
  device: auto
  run_dir: runs/tddi_seed42

evaluation:
  max_rows: null
  top_k: [1, 3, 5]
  calibration_bins: 15
  confidence_thresholds:
    low: 0.50
    high: 0.88
