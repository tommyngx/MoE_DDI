# Lightweight 6.8M-parameter shared-trunk profile retained as an ablation.
seed: 2026
run_name: moeddi_light_seed2026

data:
  root: Dataset
  train_files: [train_extracted.csv]
  validation_files: [validation_extracted.csv]
  test_files: [test_extracted.csv]
  target_column: class
  expected_num_features: 3780
  num_classes: 178
  block_size_mb: 64
  batch_size: 256
  stats_path: runs/_cache/train_stats_full.npz
  split_manifest: null

preprocessing:
  max_rows: null
  min_std: 1.0e-6
  normalization: standardize

model:
  name: moeddi
  expert_hidden_dim: 512
  expert_dim: 256
  expert_dropout: 0.15
  router_hidden_dim: 128
  router_top_k: null
  include_generalist: false
  use_shared_trunk: true
  shared_trunk_hidden_dim: 512
  use_tddi_backbone: false
  classifier_hidden_dim: 512
  classifier_dropout: 0.2

loss:
  name: focal
  gamma: 1.0
  class_weighting: none
  effective_beta: 0.9999
  label_smoothing: 0.0
  moe_balance_weight: 0.01
  router_z_weight: 0.001

training:
  epochs: 200
  max_rows: null
  max_steps_per_epoch: null
  learning_rate: 9.4526e-5
  weight_decay: 1.5446e-4
  pretrained_checkpoint: null
  tddi_pretrained_checkpoint: null
  freeze_tddi_epochs: 0
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  mixed_precision: true
  cosine_t_max: 50
  early_stopping_patience: 50
  selection_metric: macro_f1
  device: auto
  run_dir: runs/moeddi_light_seed2026

evaluation:
  max_rows: null
  top_k: [1, 3, 5]
  calibration_bins: 15
