[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "moeddi"
version = "0.1.0"
description = "MoEDDI: Mixture-of-Experts for drug-drug interaction prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "PyYAML>=6.0",
  "matplotlib>=3.10",
  "torch>=2.6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
scaffold = ["rdkit>=2024.9"]

[project.scripts]
moeddi = "cli:main"
moeddi-tddi-cv = "tddi_cv:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["Reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
